    function showMask() {
        //mask 高度设置为页面高度
        $("#mask").css("height", $(document).height());
        $("#mask").css("width", "100%");
        $("#mask").show();
        //隐藏页面滚动条
        $('body').css("overflow", "hidden");
    }

    //关闭遮罩层
    function hideMask() {
        $("#mask").hide();
        $('body').css("overflow", "auto");
    }

    function search() {
