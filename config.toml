[crawl]
timeout = 60
max_requests = 20000
delay = 0.3
retries = 2
chrome_channel = "chrome"
resume_hours = 6

[llm]
enabled = false
model = "deepseek-flash"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
max_calls = 20
timeout = 60
max_tokens = 1500

[mapping]
use_source_url_as_apply_url = true

